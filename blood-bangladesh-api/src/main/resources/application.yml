spring:
  application:
    name: blood-bangladesh-api
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:blood_bd}
    username: ${DB_USER:bb_user}
    password: ${DB_PASSWORD:bb_pass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: 15
  google:
    client-id: ${GOOGLE_CLIENT_ID:}