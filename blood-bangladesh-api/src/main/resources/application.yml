spring:
  application:
    name: blood-bangladesh-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:blood_bd}${DB_PARAMS:}
    username: ${DB_USER:bb_user}
    password: ${DB_PASSWORD:bb_pass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  mail-from: ${MAIL_FROM:}
  brevo:
    api-key: ${BREVO_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: 30
  google:
    client-id: ${GOOGLE_CLIENT_ID:}