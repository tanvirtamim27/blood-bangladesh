spring:
  application:
    name: blood-bangladesh-api
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:blood_bd}
    username: ${DB_USER:bb_user}
    password: ${DB_PASSWORD:bb_pass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  health:
    mail:
      enabled: false

server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: 30
  google:
    client-id: ${GOOGLE_CLIENT_ID:}