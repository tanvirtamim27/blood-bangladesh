services:
  db:
    image: postgres:16
    container_name: bb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blood_bd
      POSTGRES_USER: bb_user
      POSTGRES_PASSWORD: bb_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8081:8080"

volumes:
  pgdata:
